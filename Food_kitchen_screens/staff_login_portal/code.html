<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Staff Portal | BistroFlow</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Public+Sans:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#d1d5d7",
                        "inverse-surface": "#0c0f10",
                        "on-tertiary-fixed-variant": "#003b67",
                        "outline": "#757778",
                        "on-secondary-fixed": "#00480f",
                        "error-dim": "#9f0519",
                        "tertiary-container": "#70b5ff",
                        "on-secondary-container": "#005e17",
                        "on-primary-fixed": "#000000",
                        "tertiary": "#005e9f",
                        "primary-container": "#ff7949",
                        "inverse-on-surface": "#9b9d9e",
                        "on-secondary-fixed-variant": "#00691a",
                        "secondary-fixed-dim": "#83e881",
                        "surface": "#f5f6f7",
                        "on-primary": "#ffefeb",
                        "surface-variant": "#dadddf",
                        "on-secondary": "#d1ffc8",
                        "on-tertiary-fixed": "#001930",
                        "primary-dim": "#922c00",
                        "primary-fixed-dim": "#f7652f",
                        "on-error": "#ffefee",
                        "surface-container": "#e6e8ea",
                        "surface-tint": "#a63300",
                        "on-tertiary": "#edf3ff",
                        "on-surface-variant": "#595c5d",
                        "surface-container-low": "#eff1f2",
                        "primary-fixed": "#ff7949",
                        "surface-bright": "#f5f6f7",
                        "on-tertiary-container": "#003258",
                        "on-background": "#2c2f30",
                        "error": "#b31b25",
                        "secondary-fixed": "#91f78e",
                        "on-surface": "#2c2f30",
                        "inverse-primary": "#fe6a34",
                        "secondary-container": "#91f78e",
                        "primary": "#a63300",
                        "outline-variant": "#abadae",
                        "on-primary-container": "#451000",
                        "tertiary-dim": "#00528b",
                        "on-error-container": "#570008",
                        "secondary-dim": "#005d16",
                        "background": "#f5f6f7",
                        "tertiary-fixed": "#70b5ff",
                        "secondary": "#006b1b",
                        "on-primary-fixed-variant": "#551600",
                        "surface-container-highest": "#dadddf",
                        "surface-container-high": "#e0e3e4",
                        "error-container": "#fb5151",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#4ca8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Public Sans"],
                        "label": ["Public Sans"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Public Sans', sans-serif;
        }
        h1, h2, h3, .brand-font {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .kitchen-shadow {
            box-shadow: 0px 20px 40px rgba(44, 47, 48, 0.06);
        }
    </style>
</head>
<body class="bg-surface text-on-background min-h-screen flex items-center justify-center p-6">
<!-- Top Navigation (Shell Implementation) -->
<!-- Note: TopAppBar is suppressed here per "Transactional" rule, but logo is handled inside the card for identity -->
<main class="w-full max-w-[480px]">
<!-- Brand Identity Component -->
<div class="flex flex-col items-center mb-10">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">restaurant_menu</span>
<span class="text-3xl font-bold tracking-tighter text-on-surface brand-font">BistroFlow</span>
</div>
<div class="h-1 w-12 bg-primary-container rounded-full"></div>
</div>
<!-- Login Canvas -->
<div class="bg-surface-container-lowest rounded-xl p-10 kitchen-shadow border border-outline-variant/10">
<header class="mb-8">
<h1 class="text-2xl font-extrabold text-on-surface tracking-tight mb-2">Staff Portal</h1>
<p class="text-on-surface-variant body-lg">Please sign in to access your workstation</p>
</header>
<form class="space-y-6">
<!-- Input Group: ID -->
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant font-label px-1">
                        Staff ID or Email
                    </label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-highest border-none rounded-lg focus:ring-0 focus:border-b-2 focus:border-primary transition-all text-on-surface placeholder:text-outline/50" placeholder="e.g. CHEF-402" type="text"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant font-label px-1">
                        Password
                    </label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container-highest border-none rounded-lg focus:ring-0 focus:border-b-2 focus:border-primary transition-all text-on-surface" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember & Forgot Row -->
<div class="flex items-center justify-between py-2">
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer appearance-none w-6 h-6 rounded bg-surface-container-highest checked:bg-primary transition-all cursor-pointer" type="checkbox"/>
<span class="material-symbols-outlined absolute opacity-0 peer-checked:opacity-100 text-white text-sm left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none">check</span>
</div>
<span class="text-sm font-medium text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="text-sm font-bold text-primary hover:text-primary-dim transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Primary CTA -->
<button class="w-full h-[56px] rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold text-lg tracking-tight shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Bottom Actions -->
<div class="mt-8 pt-8 border-t border-surface-container flex flex-col items-center gap-4">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-primary font-semibold transition-colors">
<span class="material-symbols-outlined">swap_horiz</span>
                    Switch Role
                </button>
<div class="flex gap-4">
<div class="w-1.5 h-1.5 rounded-full bg-secondary"></div>
<span class="text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant">Secure Environment v2.4</span>
</div>
</div>
</div>
<!-- Utility Footer -->
<footer class="mt-12 text-center">
<p class="text-sm text-on-surface-variant/60 font-medium">
                © 2024 BistroFlow Culinary Systems. <br class="md:hidden"/> All rights reserved.
            </p>
</footer>
</main>
<!-- Decorative Culinary Elements (Asymmetric Layout) -->
<div class="fixed top-0 right-0 w-1/3 h-screen -z-10 overflow-hidden pointer-events-none opacity-50 hidden lg:block">
<div class="absolute top-20 -right-20 w-96 h-96 bg-primary-container/10 rounded-full blur-[100px]"></div>
<div class="absolute bottom-40 right-10 w-64 h-64 bg-tertiary-container/10 rounded-full blur-[80px]"></div>
</div>
<!-- Visual Anchor Image (Hidden on small mobile, visible on tablet/web) -->
<div class="fixed -bottom-10 -left-10 w-64 h-64 rotate-12 opacity-10 pointer-events-none hidden md:block">
<img class="w-full h-full object-cover rounded-xl grayscale" data-alt="Close-up of professional chef knives and culinary tools on a clean marble surface with soft morning light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCKw4m2uc7xOcwqx9Dp78Gs8YFoL3EDz0dP9_wEFs6R7gzD3VE-NvM5QnqzmTlQxmOVWavALOnthxf1lHJLLFFNGHjTH2u5yfDiwcmUQRWZm6-ffsHBZlMkD6ZETfYk8KG-RYs93Ky1LYJxtet0soFZ7Tjebbx5R_pjcskhhoUZSd9Vnketl4YUtBKdFW2D0gCxsGb1PjJ5oMqsot8GN3oRADJCUXKMdPxbAQSmy32jdofi5uWEy7_SmGd4wrt6pNdNMmhsnTvsunc"/>
</div>
</body></html>
